name: GitOps CI - Build & Push to DockerHub

on:
  push:
    branches:
      - feat/gitops
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bankapp-gitops-ci
  cancel-in-progress: false

env:
  DOCKERHUB_REPO: nb1991/ai-bankapp-eks

jobs:
  build-and-push:
    name: Build, Test & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/gitops

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B

      - name: Run tests
        run: ./mvnw test -B
        continue-on-error: true

      - name: Set image tag
        id: tag
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update and push Kubernetes manifest
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.sha_short }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Manifest update attempt: ${attempt}"

            git fetch origin feat/gitops
            git checkout -B manifest-update origin/feat/gitops

            sed -i -E \
              "s|(image:[[:space:]]*)${DOCKERHUB_REPO}:[^[:space:]]+|\1${DOCKERHUB_REPO}:${IMAGE_TAG}|" \
              k8s/bankapp-deployment.yml

            git add k8s/bankapp-deployment.yml

            if git diff --cached --quiet; then
              echo "Manifest already contains the requested image."
              exit 0
            fi

            git commit -m "ci: update bankapp image to ${IMAGE_TAG} [skip ci]"

            git fetch origin feat/gitops

            if ! git rebase origin/feat/gitops; then
              git rebase --abort || true
              echo "Rebase conflict; retrying."
              sleep 2
              continue
            fi

            if git push origin HEAD:feat/gitops; then
              echo "Manifest update pushed successfully."
              exit 0
            fi

            echo "Push rejected; retrying."
            sleep 2
          done

          echo "ERROR: Manifest push failed after three attempts."
          exit 1