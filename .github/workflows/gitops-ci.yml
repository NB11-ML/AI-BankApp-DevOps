name: GitOps CI - Build & Push to DockerHub

on: push: branches: [feat/gitops] paths: - 'src/**' - 'pom.xml' - 'Dockerfile' workflow_dispatch:

permissions: contents: write

env: DOCKERHUB_REPO: nb1991/ai-bankapp-eks

jobs: build-and-push: name: Build, Test & Push Docker Image runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: 'temurin'
      cache: maven

  - name: Build with Maven
    run: ./mvnw clean package -DskipTests -B

  - name: Run tests
    run: ./mvnw test -B
    continue-on-error: true

  - name: Set image tag
    id: tag
    run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  - name: Login to DockerHub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Build and Push Docker image
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: |
        ${{ env.DOCKERHUB_REPO }}:latest
        ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}
      cache-from: type=gha
      cache-to: type=gha,mode=max

  - name: Update and push Kubernetes manifest
    env:
      IMAGE_TAG: ${{ steps.tag.outputs.sha_short }}
    run: |
      set -e

      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"

      for attempt in 1 2 3; do
        echo "Manifest update attempt: $attempt"

        git fetch origin "$GITHUB_REF_NAME"
        git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

        sed -i "s|image: ${DOCKERHUB_REPO}:.*|image: ${DOCKERHUB_REPO}:${IMAGE_TAG}|" \
          k8s/bankapp-deployment.yml

        git add k8s/bankapp-deployment.yml

        if git diff --cached --quiet; then
          echo "Manifest already contains the requested image."
          exit 0
        fi

        git commit -m "ci: update bankapp image to ${IMAGE_TAG} [skip ci]