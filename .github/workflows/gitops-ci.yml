name: GitOps CI - Build & Push to DockerHub

on: push: branches: - feat/gitops paths: - 'src/**' - 'pom.xml' - 'Dockerfile' workflow_dispatch:

permissions: contents: write

env: DOCKERHUB_REPO: nb1991/ai-bankapp-eks

jobs: build-and-push: name: Build, Test & Push Docker Image runs-on: ubuntu-latest

steps:
  # 1. Checkout repository with complete Git history
  - name: Checkout code
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      ref: feat/gitops

  # 2. Configure Java 21 and Maven dependency caching
  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: temurin
      cache: maven

  # 3. Build the Spring Boot application
  - name: Build with Maven
    run: ./mvnw clean package -DskipTests -B

  # 4. Run unit tests
  - name: Run tests
    run: ./mvnw test -B
    continue-on-error: true

  # 5. Generate an immutable image tag from the source commit
  - name: Set image tag
    id: tag
    shell: bash
    run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # 6. Authenticate with DockerHub
  - name: Login to DockerHub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  # 7. Configure Docker Buildx
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  # 8. Build and publish the immutable SHA tag and latest tag
  - name: Build and Push Docker image
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: |
        ${{ env.DOCKERHUB_REPO }}:latest
        ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}
      cache-from: type=gha
      cache-to: type=gha,mode=max

  # 9. Update the Kubernetes manifest and retry concurrent push conflicts
  - name: Update and push Kubernetes manifest
    env:
      IMAGE_TAG: ${{ steps.tag.outputs.sha_short }}
    shell: bash
    run: |
      set -euo pipefail

      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"

      for attempt in 1 2 3; do
        echo "Manifest update attempt: ${attempt}"

        # Always fetch the latest remote branch
        git fetch origin feat/gitops
        git checkout -B feat/gitops origin/feat/gitops

        # Update only the BankApp application container image
        sed -i -E \
          "s|(image:[[:space:]]*)${DOCKERHUB_REPO}:[^[:space:]]+|\1${DOCKERHUB_REPO}:${IMAGE_TAG}|" \
          k8s/bankapp-deployment.yml

        git add k8s/bankapp-deployment.yml

        # Avoid creating an empty commit
        if git diff --cached --quiet; then
          echo "Manifest already contains the requested image tag."
          exit 0
        fi

        git commit -m "ci: update bankapp image to ${IMAGE_TAG} [skip ci]"

        # Retry if another push updated the branch concurrently
        if git push origin HEAD:feat/gitops; then
          echo "Manifest update pushed successfully."
          exit 0
        fi

        echo "Push failed; retrying against the latest remote branch."
        sleep 2
      done

      echo "ERROR: Manifest push failed after three attempts."
      exit 1